name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Docker is available on GitHub runners: the Butane test runs here.
      - run: npm test

  # The miniature platform: the reconciler image built from this commit
  # creates Postgres, Pocket ID, Caddy and test apps on the runner's Docker,
  # and the tests check the result (database, OIDC client, routes,
  # idempotence). Nothing secret: keys are generated for the run.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - name: Reconciler and base service logs, on failure
        if: failure()
        run: |
          for name in $(docker ps --all --format '{{.Names}}' | grep '^bivouac'); do
            echo "::group::$name"; docker logs --tail 100 "$name" 2>&1; echo "::endgroup::"
          done

  # Publishes the reconciler image after the tests pass on main, tagged with
  # the exact commit (`sha-<7 characters>`): servers name an exact version,
  # never a moving tag, so a rollback is always possible (D21, D48).
  publish-reconciler:
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build and push ghcr.io/${{ github.repository_owner }}/bivouac-reconciler
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/bivouac-reconciler:sha-${GITHUB_SHA::7}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --file packages/reconciler/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --tag "$image" .
          docker push "$image"
          echo "Published $image" >> "$GITHUB_STEP_SUMMARY"
