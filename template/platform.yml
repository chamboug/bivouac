# Base domain of the platform: each app is served on <name>.<domain>.
# A wildcard DNS record *.<domain> points to the server.
domain: apps.example.com

# This repo's SSH address on GitHub. The server reads it with a read-only
# deploy key (D30).
repository: git@github.com:example/bivouac-platform.git

# Exact version of the reconciler the server runs. A new server starts this
# one (Ignition); afterwards the reconciler moves itself to the version
# written here (D50). Pinned by digest: a tag can be pushed again (D61).
reconciler:
  image: ghcr.io/chamboug/bivouac-reconciler:sha-e4f096b@sha256:4243f6de51c21e57bbd3b155e8b2488dc697a83296b83d9802effcc68fbf835b
